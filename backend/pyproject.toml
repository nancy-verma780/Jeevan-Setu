[project]
name = "jeevansetu-backend"
version = "0.1.0"
description = "JeevanSetu emergency response API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ml = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0"]
dev = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
